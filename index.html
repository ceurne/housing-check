*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}

    if (w) return fill(w.ans, c);
    if (dim === "type" && c.typeAns) return fill(c.typeAns, c);
    if (dim === "station" && c.stationAns) return fill(c.stationAns, c);
    if (dim === "bedrooms" && c.bedroomsAns) return fill(c.bedroomsAns, c);
    if (dim === "station") return fill(c.a.transport, c);
    if (dim === "type") return fill(`${"{We}"} do not mind what kind of home it is, as long as it fits ${"{our}"} other wishes.`, c);
    return null;
  }

  const ALLOW = {};
  function allowFor(c, homes, advisor) {
    const key = c.id + "|" + (advisor || "");
    if (ALLOW[key]) return ALLOW[key];
    const s = new Set();
    const addWords = str => String(str || "").toLowerCase().split(/[^a-zà-ÿ'-]+/).forEach(w => w && s.add(w));
    [c.name, c.short, c.sign, c.from, advisor, "Biscoito Pip Marmalade Joana Kwame Lena Marta Ji-woo Daniel Mateus Aiko Olivia Tomasz Amira Sophie Silva Tanaka Mensah Becker Hughes Kowalski Haddad Park Reyes Tremblay Kerkelanden Overwhere Weidevenne Schalkwijk Julianadorp Huiswaard Oudorp Krommenie IJmuiden NHG BKR Nibud Funda Kadaster"].forEach(addWords);
    Object.values(homes || {}).forEach(h => { addWords(h.city); addWords(h.area); addWords(h.street); });
    CITY_NAMES.forEach(addWords);
    return (ALLOW[key] = s);
  }
  function languageReply(c, L, ctx) {
    const n = (ctx && ctx.complaints) || 0;
    const what = L.reason === "language"
      ? "I am sorry, but I find your e-mail quite difficult to understand. There are a lot of mistakes in it, and that worries {us} a little."
      : "To be honest, your e-mail feels very casual.";
    if (n === 0) return fill(what + " {We} are about to make the biggest financial decision of {our} life, and {we} would like to feel that you take {us} seriously. Could you please write to {us} again in a clear and professional way? Then {we} will gladly answer your questions.", c);
    if (n === 1) return fill(what + " This is the second time {we} have to ask you this, and {we} do not feel taken seriously. Please send {us} a professional e-mail. If the next one is not better, {we} will ask for another advisor.", c);
    return fill("{We} are disappointed. {We} have asked three times for a professional e-mail. {We} have contacted your manager to ask for another advisor. If you want to keep working with {us}, please send a clear, polite and correct e-mail.", c);
  }

  function reply(c, text, homes, advisor, ctx) {
    const P = pron(c);
    const greet = "Dear " + (advisor || "advisor") + ",";
    const close = "\n\nKind regards,\n" + c.sign;
    const wrap = body => greet + "\n\n" + body + close;
    const t = text.trim();
    if (looksDutch(t)) return wrap(fill(c.common.dutch, c));
    if (RUDE.test(t)) return wrap(fill(c.common.rude, c));
    const LANG = root.HousingCheckLanguage && root.HC_WORDS ? root.HousingCheckLanguage.check(t, { allow: allowFor(c, homes, advisor) }) : { level: 0 };
    if (LANG.level === 2) return wrap(languageReply(c, LANG, ctx));
    const opener = ctx && ctx.complaints > 0 && LANG.level === 0 ? fill("Thank you for your clear and professional e-mail. ", c) : "";
    const remark = LANG.level === 1
      ? fill(LANG.reason === "language"
        ? "P.S. Some parts of your e-mail were a little hard for {us} to understand, but I think I know what you mean."
        : "P.S. Your e-mail felt a little informal. {We} are about to make a big decision, so {we} appreciate a professional tone.", c)
      : "";

    const body = stripFrame(t);
    const parts = [];
    const used = new Set();
    const add = (key, s, pos) => {
      if (!s || used.has(key)) return;
      const head = s.slice(0, 45);
      if (parts.some(p => p.s.includes(head) || s.includes(p.s.slice(0, 45)))) { used.add(key); return; }
      used.add(key); parts.push({ s, pos });
    };

    // 1. homes proposed by the advisor
    const ids = listingsIn(t);
    const saidTooExp = /\b(too expensive|over (your|the) budget|above (your|the) budget|can'?not afford|can't afford|cannot afford|not affordable|out of (your|the) budget|outside (your|the) budget)\b/i.test(t);
    const saidAffordable = !saidTooExp && /\b(you can afford|is affordable|within your budget|fits your budget|you can buy|in your budget|you can pay)\b/i.test(t);
    let labelMentioned = false, anyTooExp = false;
    if (ids.length) {
      const reacts = [];
      for (const id of ids) {
        const h = homes[id];
        if (!h) { reacts.push({ text: fill(c.common.unknownListing, c, { id }), worst: "x" }); continue; }
        const near = ids.length === 1 ? t : sentencesOf(t).filter(x => listingsIn(x).includes(id)).join(" ");
        const tooExpHere = TOO_EXP.test(near), affHere = !tooExpHere && AFFORD_SAID.test(near);
        if (tooExpHere) anyTooExp = true;
        const r = reactToHome(c, h, affHere, tooExpHere); if (/energy label/.test(r.text)) labelMentioned = true; reacts.push(Object.assign({ id }, r));
      }
      reacts.forEach((r, i) => add("home" + i, r.text, -100 + i));
      const ok = reacts.filter(r => r.id && !r.tooExp && (r.worst === "none" || r.worst === "flexible"));
      if (/\b(safer|safe|buffer|risk|if (the )?(interest|rates?)[^.?!]{0,20}(rise|go up|goes up|increase))\b/i.test(t) && ok.length)
        add("safe", `Thank you for thinking about the risk. If the interest rate goes up, ${P.we} still want to be able to pay ${P.our} mortgage, so that is important to ${P.us}.`, -45);
      if (anyTooExp && !ok.length) add("tooExp", fill(c.common.tooExpensive, c), -40);
      if (ok.length > 1) add("pref", compareHomes(c, ok.map(r => homes[r.id])), -50);
    }

    // 2. wish dimensions and intents, kept in order of appearance
    const sentences = body.split(/(?<=[.?!])\s+|\n+/).filter(Boolean);
    let offset = 0;
    for (const sent of sentences) {
      const pos = body.indexOf(sent, offset); offset = pos + sent.length;
      const s = sent;
      const hasOtherCity = citiesIn(s).length > 0 && !listingsIn(s).length;
      // told maximum / affordability
      if (I.toldMax.test(s)) { add("toldMax", fill(ids.length ? c.common.toldMaxWithHome : c.common.toldMax, c), pos); continue; }
      // priorities before single wishes
      const dimHere = Object.keys(DIM).some(d => DIM[d].test(s)) || citiesIn(s).length > 0;
      if (I.priorities.test(s) && !dimHere) add("priorities", fill(c.a.priorities, c), pos);
      const ORDER_KEYS = ["rentvsbuy","wait","stay","job","hours","income","contract","savings","gift","debts","costs","comfort","buyingCosts","schools","kids","pets","hobbies","currentHome","timing"];
      const otherIntentHere = ORDER_KEYS.some(k => I[k].test(s));
      for (const d of Object.keys(DIM)) {
        if (d === "location" && I.stay.test(s)) continue;
        if (d === "location" && !DIM.location.test(s) && otherIntentHere) continue;
        const sd = d === "type" ? s.replace(/\b(the|this|that|your|my|our) (apartment|flat|house|home)\b/gi, "") : s;
        if (d === "type" && I.floor.test(s) && !/\bhouse\b/i.test(s)) continue;
        if (DIM[d].test(sd) || (d === "location" && hasOtherCity)) {
          if (listingsIn(s).length) continue;
          if (ids.length && !/\?/.test(s)) continue;
          if (d === "type" && !/\b(house|houses|instead|prefer|rather|okay|ok|fine|accept|consider|kind|type|terraced|corner|detached|flat|or|want|need|like|looking)\b/i.test(sd.replace(/\b(an? )?apartments?\b/gi, ""))) continue;
          add("dim:" + d, wishAnswer(c, d, s), pos + 1);
        }
      }
      if (I.afford.test(s) && !used.has("toldMax") && !I.comfort.test(s) && !saidAffordable && !saidTooExp && !ids.length) add("afford", fill(c.common.afford, c), pos + 2);
      const order = ["rentvsbuy","wait","risk","interest","currentHome","timing","stay","job","hours","income","contract","partner","household","savings","gift","debts","costs","comfort","buyingCosts","nhg","mortgageType","tax","energy","renovation","size","parking","floor","area","schools","shops","kids","pets","commute","transport","hobbies","otherWishes","kitchen","noise","askPermission","viewing","meeting","documents","employerLetter","offer","moreQuestions","smalltalk","howAreYou"];
      for (const k of order) {
        if (!I[k].test(s)) continue;
        if (k === "interest" && I.mortgageType.test(s)) continue;
        if ((k === "risk" || k === "interest") && used.has("safe")) continue;
        if (k === "partner" && /^(joana|kwame|marta|ji-?woo|daniel|lena)$/i.test((s.match(I.partner) || [""])[0]) && ORDER_KEYS.some(x => x !== "partner" && I[x].test(s))) continue;
        if ((k === "wait" && used.has("timing")) || (k === "timing" && used.has("wait"))) continue;
        if (k === "pets" && used.has("dim:outdoor")) continue;
        if (k === "transport" && used.has("debts") && /\blease\b/i.test(s)) continue;
        if (k === "income" && /\b(only your income|your income counts)\b/i.test(s)) continue;
        if (k === "interest" && (used.has("wait") || used.has("risk") || /\b(wait|later|next year|go down|lower|go up|rise|risk|what if|what happens)\b/i.test(s))) { if (!used.has("wait") && !used.has("risk")) add("risk", fill(c.a.risk, c), pos + 3); continue; }
        if (k === "risk" && /\b(area|street|neighbou?rhood)\b/i.test(s)) continue;
        if ((k === "wait" && used.has("rentvsbuy")) || (k === "rentvsbuy" && used.has("wait"))) continue;
        if (k === "energy" && labelMentioned) continue;
        if (k === "currentHome" && /\bbrother\b/i.test(s)) continue;
        if (k === "transport" && used.has("parking")) continue;
        if (k === "commute" && /\b(lose|lost|unemploy|fired)\b/i.test(s)) continue;
        if (k === "noise" && c.a.noise == null) { if (!used.has("area")) add("area", fill(c.a.area, c), pos + 3); continue; }
        if (k === "household") { add("partner", fill(c.a.partner, c), pos + 3); add("kids", fill(c.a.kids, c), pos + 3); continue; }
        if (k === "transport" && (used.has("dim:station") || DIM.station.test(s))) continue;
        if (k === "size" && DIM.outdoor.test(s)) continue;
        if (k === "kids" && (DIM.bedrooms.test(s) || I.schools.test(s))) continue;
        if (k === "pets" && DIM.outdoor.test(s)) continue;
        if (k === "hobbies" && (I.pets.test(s) && /\bdog|cat/i.test(s))) continue;
        if (k === "hobbies" && I.noise.test(s) && c.a.noise != null) continue;

    let picked = parts.sort((a, b) => a.pos - b.pos).map(p => p.s);
    // keep it readable: at most 5 paragraphs
    if (picked.length > 6) picked = picked.slice(0, 6).concat([`${P.We} will answer your other questions in ${P.our} next e-mail.`]);

      const tail = remark ? "\n\n" + remark : "";
      if (/\b(thank|thanks)\b/i.test(t) && !/\?/.test(t)) return wrap(opener + fill(c.common.thanks, c) + tail);
      if (!/\?/.test(t) && t.length < 400) return wrap(opener + fill(c.common.greetingOnly, c) + tail);

  }

      &lt;label for=&quot;advisor&quot; class=&quot;eyebrow&quot;&gt;Your name or group&lt;/label&gt;
      &lt;input id=&quot;advisor&quot; placeholder=&quot;e.g. Group 3 (Sem and Noor)&quot; maxlength=&quot;40&quot; autocomplete=&quot;off&quot;&gt;
      &lt;span class=&quot;note&quot; id=&quot;startNote&quot; hidden&gt;&lt;/span&gt;
    &lt;/div&gt;
    &lt;div class=&quot;step&quot;&gt;
      &lt;h2&gt;&lt;span class=&quot;n&quot;&gt;2&lt;/span&gt;Which client did your teacher give you?&lt;/h2&gt;
      &lt;div class=&quot;cards&quot; id=&quot;cards&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section id=&quot;chat&quot; hidden&gt;
    &lt;div class=&quot;bar&quot;&gt;
      &lt;div class=&quot;who&quot;&gt;&lt;span class=&quot;av&quot; id=&quot;barAv&quot;&gt;&lt;/span&gt;&lt;div&gt;&lt;span class=&quot;eyebrow&quot;&gt;Your client&lt;/span&gt;&lt;h2 id=&quot;barName&quot;&gt;&lt;/h2&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;tools&quot;&gt;&lt;span class=&quot;hint&quot; id=&quot;barMe&quot;&gt;&lt;/span&gt;&lt;button class=&quot;btn&quot; id=&quot;change&quot; type=&quot;button&quot;&gt;Change client&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;app single&quot; style=&quot;margin-top:16px&quot;&gt;
      &lt;section class=&quot;thread&quot; aria-live=&quot;polite&quot;&gt;
        &lt;div class=&quot;thead&quot;&gt;
          &lt;div&gt;&lt;span class=&quot;eyebrow&quot; id=&quot;tfrom&quot;&gt;&lt;/span&gt;&lt;h2 id=&quot;tsubject&quot;&gt;&lt;/h2&gt;&lt;/div&gt;
          &lt;div class=&quot;tools&quot;&gt;
            &lt;button class=&quot;btn&quot; id=&quot;copy&quot; type=&quot;button&quot;&gt;Copy conversation&lt;/button&gt;
            &lt;button class=&quot;btn&quot; id=&quot;reset&quot; type=&quot;button&quot;&gt;Start over&lt;/button&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;msgs&quot; id=&quot;msgs&quot;&gt;&lt;/div&gt;
        &lt;form class=&quot;compose&quot; id=&quot;form&quot;&gt;
          &lt;label for=&quot;text&quot; class=&quot;eyebrow&quot;&gt;Your reply&lt;/label&gt;
          &lt;textarea id=&quot;text&quot; placeholder=&quot;Dear …,&amp;#10;&amp;#10;Thank you for your e-mail. I have a question about …&quot;&gt;&lt;/textarea&gt;
          &lt;div class=&quot;crow&quot;&gt;
            &lt;span class=&quot;hint&quot;&gt;Write a formal e-mail in English: start with “Dear …,”, end with “Kind regards,” and your name, and check your spelling. Your client expects a professional advisor. Ask one or two clear questions per e-mail. Mention a listing number (for example NH-057) to ask what your client thinks of a home. Your client does not know how much they can borrow; that is your job.&lt;/span&gt;
            &lt;button class=&quot;btn primary&quot; id=&quot;send&quot; type=&quot;submit&quot;&gt;Send&lt;/button&gt;
          &lt;/div&gt;
          &lt;span class=&quot;note&quot; id=&quot;note&quot; hidden&gt;&lt;/span&gt;
        &lt;/form&gt;
      &lt;/section&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;footer&gt;All clients and homes are fictional. Your conversations are saved only in this browser on this device; nothing is sent anywhere.&lt;/footer&gt;
&lt;/div&gt;

&lt;script&gt;
const CLIENTS = window.HC_DATA.clients;
const KEY = &quot;housing-check-inbox-v2&quot;;
let S = { sel: null, advisor: &quot;&quot;, threads: {} };
try { const d = JSON.parse(localStorage.getItem(KEY) || &quot;null&quot;); if (d) S = Object.assign(S, d); } catch (e) {}
const save = () =&gt; { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const $ = id =&gt; document.getElementById(id);
const byId = id =&gt; CLIENTS.find(c =&gt; c.id === id);
const thread = id =&gt; (S.threads[id] = S.threads[id] || []);
const initials = n =&gt; n.split(/\s+/).map(w =&gt; w[0]).slice(0, 2).join(&quot;&quot;).toUpperCase();
const stamp = () =&gt; new Date().toLocaleString(&quot;en-GB&quot;, { weekday: &quot;short&quot;, hour: &quot;2-digit&quot;, minute: &quot;2-digit&quot; });
let busy = false;

/* ---------- start screen ---------- */
function renderStart() {
  $(&quot;start&quot;).hidden = false; $(&quot;chat&quot;).hidden = true;
  $(&quot;advisor&quot;).value = S.advisor;
  const box = $(&quot;cards&quot;); box.innerHTML = &quot;&quot;;
  CLIENTS.forEach((c, i) =&gt; {
    const b = document.createElement(&quot;button&quot;);
    b.type = &quot;button&quot;; b.className = &quot;ccard&quot;;
    const n = thread(c.id).filter(m =&gt; m.who === &quot;advisor&quot;).length;
    b.innerHTML = `&lt;span class=&quot;av&quot;&gt;&lt;/span&gt;&lt;span class=&quot;it&quot;&gt;&lt;b&gt;&lt;/b&gt;&lt;span class=&quot;from&quot;&gt;&lt;/span&gt;&lt;span class=&quot;look&quot;&gt;&lt;/span&gt;&lt;span class=&quot;go&quot;&gt;&lt;/span&gt;&lt;/span&gt;`;
    b.querySelector(&quot;.av&quot;).textContent = initials(c.short);
    b.querySelector(&quot;b&quot;).textContent = (i + 1) + &quot;. &quot; + c.short;
    b.querySelector(&quot;.from&quot;).textContent = &quot;From &quot; + c.from;
    b.querySelector(&quot;.look&quot;).textContent = &quot;Looking for a home in &quot; + c.cities.join(&quot; or &quot;);
    b.querySelector(&quot;.go&quot;).textContent = n ? `Continue (${n} e-mail${n === 1 ? &quot;&quot; : &quot;s&quot;} sent) →` : &quot;Open mailbox →&quot;;
    b.onclick = () =&gt; {
      const name = $(&quot;advisor&quot;).value.trim();
      if (name.length &lt; 2) { const n = $(&quot;startNote&quot;); n.textContent = &quot;Fill in your name or group first.&quot;; n.hidden = false; $(&quot;advisor&quot;).focus(); return; }
      S.advisor = name; S.sel = c.id; save(); renderChat(); window.scrollTo(0, 0); $(&quot;text&quot;).focus();
    };
    box.appendChild(b);
  });
}

/* ---------- chat screen ---------- */
function coachItems(r) {
  const items = [];
  r.tone.forEach(x =&gt; items.push([x.msg, x.fix]));
  r.spelling.forEach(x =&gt; items.push([`Spelling: “${x.word}”`, x.suggestion ? `Did you mean “${x.suggestion}”?` : &quot;Check this word.&quot;]));
  r.grammar.forEach(x =&gt; items.push([`Phrasing: “${x.found}”`, `Better: ${x.fix}. ${x.why}`]));
  return items;
}
function coachEl(r) {
  const d = document.createElement(&quot;aside&quot;);
  const items = coachItems(r);
  d.className = &quot;coach &quot; + (r.level === 2 ? &quot;l2&quot; : items.length ? &quot;l1&quot; : &quot;ok&quot;);
  const head = r.level === 2 ? &quot;Writing coach · your client did not answer this e-mail&quot; : items.length ? &quot;Writing coach · tips for your next e-mail&quot; : &quot;Writing coach · clear and professional, well done&quot;;
  d.innerHTML = `&lt;b class=&quot;h&quot;&gt;&lt;/b&gt;${items.length ? &quot;&lt;ul&gt;&lt;/ul&gt;&quot; : &quot;&quot;}`;
  d.querySelector(&quot;.h&quot;).textContent = head;
  const ul = d.querySelector(&quot;ul&quot;);
  items.forEach(([a, b]) =&gt; { const li = document.createElement(&quot;li&quot;); li.innerHTML = &quot;&lt;span&gt;&lt;/span&gt; &lt;span class=&#x27;fix&#x27;&gt;&lt;/span&gt;&quot;; li.children[0].textContent = a; li.children[1].textContent = b || &quot;&quot;; ul.appendChild(li); });
  return d;
}
function msgEl(who, from, to, when, text, isNew) {
  const d = document.createElement(&quot;article&quot;);
  d.className = &quot;msg &quot; + who + (isNew ? &quot; new&quot; : &quot;&quot;);
  d.innerHTML = `&lt;div class=&quot;meta&quot;&gt;&lt;span&gt;&lt;b&gt;&lt;/b&gt; → &lt;span class=&quot;to&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;when&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;body&quot;&gt;&lt;/div&gt;`;
  d.querySelector(&quot;b&quot;).textContent = from; d.querySelector(&quot;.to&quot;).textContent = to;
  d.querySelector(&quot;.when&quot;).textContent = when; d.querySelector(&quot;.body&quot;).textContent = text;
  return d;
}
function renderChat(newIdx = -1) {
  const c = byId(S.sel); if (!c) return renderStart();
  $(&quot;start&quot;).hidden = true; $(&quot;chat&quot;).hidden = false;
  const me = S.advisor || &quot;Advisor&quot;;
  $(&quot;barAv&quot;).textContent = initials(c.short); $(&quot;barName&quot;).textContent = c.short + &quot; · &quot; + c.from; $(&quot;barMe&quot;).textContent = &quot;Advisor: &quot; + me;
  $(&quot;tfrom&quot;).textContent = c.name; $(&quot;tsubject&quot;).textContent = c.subject;
  const box = $(&quot;msgs&quot;); box.innerHTML = &quot;&quot;;
  box.appendChild(msgEl(&quot;client&quot;, c.name, me, &quot;First e-mail&quot;, c.email));
  thread(c.id).forEach((m, i) =&gt; {
    box.appendChild(msgEl(m.who, m.who === &quot;advisor&quot; ? me : c.name, m.who === &quot;advisor&quot; ? c.name : me, m.when, m.text, i === newIdx));
    if (m.who === &quot;advisor&quot; &amp;&amp; m.coach) box.appendChild(coachEl(m.coach));
  });
  box.scrollTop = box.scrollHeight;
}

/* ---------- actions ---------- */
$(&quot;advisor&quot;).addEventListener(&quot;input&quot;, e =&gt; { S.advisor = e.target.value.trim(); $(&quot;startNote&quot;).hidden = true; save(); });
$(&quot;change&quot;).addEventListener(&quot;click&quot;, () =&gt; { S.sel = null; save(); renderStart(); });
$(&quot;form&quot;).addEventListener(&quot;submit&quot;, async e =&gt; {
  e.preventDefault(); if (busy) return;
  const ta = $(&quot;text&quot;), text = ta.value.trim(), note = $(&quot;note&quot;); note.hidden = true;
  if (text.length &lt; 10) { note.textContent = &quot;Write a little more before you send.&quot;; note.hidden = false; return; }
  const c = byId(S.sel), t = thread(c.id);
  t.push({ who: &quot;advisor&quot;, text, when: stamp() }); ta.value = &quot;&quot;; save(); renderChat(t.length - 1);
  busy = true; $(&quot;send&quot;).disabled = true;
  const box = $(&quot;msgs&quot;), typing = document.createElement(&quot;div&quot;);
  typing.className = &quot;typing&quot;; typing.textContent = c.sign + &quot; is writing…&quot;; box.appendChild(typing); box.scrollTop = box.scrollHeight;
  await new Promise(r =&gt; setTimeout(r, 900 + Math.random() * 900));
  const E = window.HousingCheckEngine, LG = window.HousingCheckLanguage;
  const check = LG &amp;&amp; window.HC_WORDS ? LG.check(text, { allow: E.allowFor(c, window.HC_DATA.homes, S.advisor) }) : null;
    const prevComplaints = t.slice(0, -1).filter(m =&gt; m.who === &quot;advisor&quot; &amp;&amp; m.coach &amp;&amp; m.coach.level === 2).length;
  if (check) t[t.length - 1].coach = { level: check.level, tone: check.tone.map(x =&gt; ({ msg: x.msg, fix: x.fix })), spelling: check.spelling, grammar: check.grammar };
  const reply = E.reply(c, text, window.HC_DATA.homes, S.advisor, { complaints: prevComplaints });
  typing.remove();
  t.push({ who: &quot;client&quot;, text: reply, when: stamp() }); save();
  busy = false; $(&quot;send&quot;).disabled = false; renderChat(t.length - 1);
});
$(&quot;reset&quot;).addEventListener(&quot;click&quot;, () =&gt; {
  const b = $(&quot;reset&quot;);
  if (b.dataset.armed) { S.threads[S.sel] = []; save(); delete b.dataset.armed; b.textContent = &quot;Start over&quot;; renderChat(); return; }
  b.dataset.armed = &quot;1&quot;; b.textContent = &quot;Click again to delete&quot;;
  setTimeout(() =&gt; { delete b.dataset.armed; b.textContent = &quot;Start over&quot;; }, 3000);
});
$(&quot;copy&quot;).addEventListener(&quot;click&quot;, async () =&gt; {
  const c = byId(S.sel), me = S.advisor || &quot;Advisor&quot;;
  const coachTxt = m =&gt; m.coach ? &quot;\n[Writing coach: &quot; + (coachItems(m.coach).map(x =&gt; x.join(&quot; &quot;)).join(&quot; | &quot;) || &quot;clear and professional&quot;) + &quot;]&quot; : &quot;&quot;;
  const all = [`From: ${c.name}\n${c.email}`, ...thread(c.id).map(m =&gt; `From: ${m.who === &quot;advisor&quot; ? me : c.name} (${m.when})\n${m.text}${m.who === &quot;advisor&quot; ? coachTxt(m) : &quot;&quot;}`)].join(&quot;\n\n---\n\n&quot;);
  try { await navigator.clipboard.writeText(all); $(&quot;copy&quot;).textContent = &quot;Copied&quot;; }
  catch (e) { $(&quot;copy&quot;).textContent = &quot;Copy not allowed here&quot;; }
  setTimeout(() =&gt; $(&quot;copy&quot;).textContent = &quot;Copy conversation&quot;, 2000);
});
S.sel &amp;&amp; byId(S.sel) ? renderChat() : renderStart();
&lt;/script&gt;

.cfoot{margin-top:auto;display:flex;justify-content:flex-end;padding:0 10px 8px}
.del{border:0;background:none;color:var(--muted);font-size:.75rem;padding:4px 6px}
.del:hover{color:var(--bad)}
.addcard{border:1.5px dashed var(--line);border-radius:var(--r);background:transparent;color:var(--muted);min-height:160px;font-weight:600}
.addcard:hover{border-color:var(--accent);color:var(--accent)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel p.lead{margin:0;color:var(--muted);font-size:.88rem;max-width:72ch}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}
@media (max-width:960px){.two{grid-template-columns:1fr}}
.chartbox{overflow-x:auto}
svg text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
svg .lbl{fill:var(--ink);font-family:var(--f-body);font-size:12px;font-weight:500}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.verdict-line{font-size:.95rem;padding:10px 12px;border-radius:8px;background:var(--sunk)}
.verdict-line b{font-family:var(--f-display)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
th:first-child,td:first-child{text-align:left}
tr.cur td{background:var(--accent-soft);font-weight:600}
td.ok{color:var(--good);font-weight:600} td.no{color:var(--bad);font-weight:600}
.prompt{border-left:3px solid var(--accent);padding:6px 12px;font-size:.86rem;background:var(--accent-soft);border-radius:0 6px 6px 0}
footer{color:var(--muted);font-size:.78rem;max-width:90ch}
.selectrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select{font:inherit;border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:6px;padding:5px 8px}

function normId(s){const m=String(s||&quot;&quot;).match(/(\d{1,3})/);return m?&quot;NH-&quot;+String(+m[1]).padStart(3,&quot;0&quot;):&quot;&quot;}
function wishOk(h,w){const x=h[w.f];return w.op===&quot;in&quot;?w.v.includes(x):w.op===&quot;notin&quot;?!w.v.includes(x):w.op===&quot;&gt;=&quot;?x&gt;=w.v:x&lt;=w.v}
function hydrate(e){
  const cl=HCD.clients.find(x=&gt;x.id===e.client)||HCD.clients[0];
  if(cl)e.client=cl.id;
  const iv=INCOME[e.client]||[50000,10000,1250];e.inc=iv[0];e.own=iv[1];e.step=iv[2];
  e.listing=normId(e.listing);const h=HCD.homes[e.listing];
  e.valid=!!h;e.price=h?h.price:0;e.unknown=!!e.listing&amp;&amp;!h;
  e.name=(e.group||&quot;?&quot;)+&quot; · &quot;+(cl?cl.short:&quot;&quot;);
  e.fit=&quot;&quot;;e.fitText=&quot;&quot;;e.nl=&quot;&quot;;e.en=&quot;&quot;;
  if(h&amp;&amp;cl){
    const miss=cl.wishes.filter(w=&gt;!wishOk(h,w));
    const typ=h.type===&quot;Apartment&quot;?&quot;apartment&quot;:h.type.toLowerCase();
    e.nl=e.en=`${h.city} (${h.area}), ${typ}, ${h.m2} m², ${h.bedrooms} bd, label ${h.label}`;
    e.fit=!miss.length?&quot;fits&quot;:miss.every(w=&gt;w.imp===&quot;flexible&quot;)?&quot;gives&quot;:&quot;misses&quot;;
    const DN={location:&quot;location&quot;,type:&quot;type of home&quot;,outdoor:&quot;outdoor space&quot;,station:&quot;distance to station&quot;,bedrooms:&quot;bedrooms&quot;};
    e.fitText=miss.map(w=&gt;DN[w.dim]||w.dim).join(&quot;, &quot;);
  }
  return e;
}

/* Model: identical to the teacher spreadsheet */
function annuity(rate,term){const i=rate/12,n=term*12;return i===0?n:(1-Math.pow(1+i,-n))/i}
function calc(c,rate){
  const eff=rate??(S.rate+S.shock), f=annuity(eff,S.term);
  const maxMonthly=c.inc/12*S.quote, maxMortgage=maxMonthly*f, loan=Math.max(0,c.price-c.own);
  const monthly=loan/f, maxPrice=maxMortgage+c.own;
  return {eff,maxMonthly,maxMortgage,loan,monthly,maxPrice,room:maxMonthly-monthly,ok:c.valid===false?null:monthly&lt;=maxMonthly+1e-9};
}
function timeline(c){
  const f=annuity(S.rate+S.shock,S.term),rows=[];
  for(let y=0;y&lt;=10;y++){const price=c.price*Math.pow(1+S.pg,y),inc=c.inc+(c.step||0)*y;
    const maxP=inc/12*S.quote*f+c.own;rows.push({y,price,inc,maxP,diff:maxP-price,ok:maxP&gt;=price})}
  return rows;
}

/* Parameters */
const PARAMS=[
 {k:&quot;rate&quot;,l:&quot;p_rate&quot;,h:&quot;p_rate_h&quot;,min:0,max:.08,step:.0025,fmt:x=&gt;pct(x,2)},
 {k:&quot;quote&quot;,l:&quot;p_quote&quot;,h:&quot;p_quote_h&quot;,min:.15,max:.4,step:.01,fmt:x=&gt;pct(x,0)},
 {k:&quot;term&quot;,l:&quot;p_term&quot;,h:&quot;p_term_h&quot;,min:10,max:30,step:5,fmt:x=&gt;x+&quot; &quot;+t(&quot;yrs&quot;)},
 {k:&quot;pg&quot;,l:&quot;p_pg&quot;,h:&quot;p_pg_h&quot;,min:-.04,max:.1,step:.005,fmt:x=&gt;pct(x,1)}
];
function buildParams(){
  const box=document.getElementById(&quot;params&quot;);box.innerHTML=&quot;&quot;;
  PARAMS.forEach(p=&gt;{const d=document.createElement(&quot;div&quot;);d.className=&quot;param&quot;;
    d.innerHTML=`&lt;label for=&quot;p-${p.k}&quot;&gt;&lt;span&gt;${t(p.l)}&lt;/span&gt;&lt;span class=&quot;num&quot; id=&quot;v-${p.k}&quot;&gt;&lt;/span&gt;&lt;/label&gt;
    &lt;input type=&quot;range&quot; id=&quot;p-${p.k}&quot; min=&quot;${p.min}&quot; max=&quot;${p.max}&quot; step=&quot;${p.step}&quot; value=&quot;${S[p.k]}&quot;&gt;&lt;small&gt;${t(p.h)}&lt;/small&gt;`;
    box.appendChild(d);
    d.querySelector(&quot;input&quot;).addEventListener(&quot;input&quot;,e=&gt;{S[p.k]=+e.target.value;render()});
  });
}
const SHOCKS=[0,.005,.01,.015,.02];
function buildChips(){
  const box=document.getElementById(&quot;shockChips&quot;);box.innerHTML=&quot;&quot;;
  SHOCKS.forEach(v=&gt;{const b=document.createElement(&quot;button&quot;);b.className=&quot;chip&quot;;b.textContent=&quot;+&quot;+pct(v,1);
    b.dataset.v=v;b.onclick=()=&gt;{S.shock=v;document.getElementById(&quot;shock&quot;).value=v*100;render()};box.appendChild(b)});
}

/* Render */
let prevOk=null;
function render(){
  PARAMS.forEach(p=&gt;{document.getElementById(&quot;v-&quot;+p.k).textContent=p.fmt(S[p.k])});
  document.getElementById(&quot;shockBig&quot;).textContent=&quot;+&quot;+pct(S.shock,1);
  document.querySelectorAll(&quot;#shockChips .chip&quot;).forEach(b=&gt;b.setAttribute(&quot;aria-pressed&quot;,Math.abs(+b.dataset.v-S.shock)&lt;1e-9));
  document.getElementById(&quot;effRate&quot;).textContent=pct(S.rate+S.shock,2);
  const res=S.clients.map(c=&gt;calc(c));
  const nOk=res.filter(r=&gt;r.ok===true).length, nValid=res.filter(r=&gt;r.ok!==null).length;
  document.getElementById(&quot;score&quot;).textContent=`${nOk} / ${nValid}`;
  const rn=document.getElementById(&quot;refnote&quot;);
  if(S.ref){const flips=S.clients.filter((c,i)=&gt;S.ref[i]&amp;&amp;S.ref[i].ok!==null&amp;&amp;res[i].ok!==null&amp;&amp;S.ref[i].ok!==res[i].ok).length;
    rn.innerHTML=`&lt;span&gt;${t(&quot;refOn&quot;,{r:&quot;&lt;b&gt;&quot;+pct((S.ref.find(x=&gt;x)||{}).eff,2)+&quot;&lt;/b&gt;&quot;})}&lt;/span&gt;&lt;b style=&quot;color:var(--shock)&quot;&gt;${t(&quot;flipped&quot;,{n:flips})}&lt;/b&gt;`;
  }else rn.textContent=t(&quot;refOff&quot;);
  document.getElementById(&quot;clearSnap&quot;).hidden=!S.ref;
  renderGrid(res);renderCmp(res);renderDetail();
  prevOk=res.map(r=&gt;r.ok);save();
}

function renderGrid(res){
  const g=document.getElementById(&quot;grid&quot;);
  const focusId=document.activeElement&amp;&amp;document.activeElement.id;
  g.innerHTML=&quot;&quot;;
  S.clients.forEach((c,i)=&gt;{const r=res[i],ref=S.ref&amp;&amp;S.ref[i];
    const el=document.createElement(&quot;article&quot;);el.className=&quot;card&quot;+(i===S.sel?&quot; sel&quot;:&quot;&quot;);
    if(prevOk&amp;&amp;prevOk[i]!==undefined&amp;&amp;prevOk[i]!==r.ok)el.classList.add(&quot;flip&quot;);
    const share=Math.min(1,r.maxPrice/Math.max(c.price,r.maxPrice));
    const d=ref?r.maxPrice-ref.maxPrice:0;
    el.innerHTML=`
    &lt;div class=&quot;chead&quot;&gt;&lt;div class=&quot;who&quot;&gt;
      &lt;span class=&quot;name&quot; style=&quot;font-family:var(--f-display);font-weight:700;font-size:1.05rem&quot;&gt;${esc(c.name)}&lt;/span&gt;
      &lt;span class=&quot;desc&quot;&gt;${c.valid?esc(c.listing+&quot; · &quot;+c[S.lang]):esc(c.unknown?t(&quot;unknown&quot;):t(&quot;enterHome&quot;))}&lt;/span&gt;
      ${c.valid?`&lt;span class=&quot;desc&quot; style=&quot;color:${c.fit===&quot;misses&quot;?&quot;var(--bad)&quot;:&quot;var(--muted)&quot;};font-weight:600&quot;&gt;${c.fit===&quot;fits&quot;?t(&quot;fits&quot;):t(c.fit,{w:c.fitText})}&lt;/span&gt;`:&quot;&quot;}&lt;/div&gt;
      ${r.ok===null?`&lt;span class=&quot;pill&quot; style=&quot;background:var(--sunk);color:var(--muted)&quot;&gt;${t(&quot;noHome&quot;)}&lt;/span&gt;`:`&lt;span class=&quot;pill ${r.ok?&quot;ok&quot;:&quot;no&quot;}&quot;&gt;${r.ok?t(&quot;ok&quot;):t(&quot;no&quot;)}&lt;/span&gt;`}&lt;/div&gt;
    ${ref&amp;&amp;ref.ok!==r.ok?`&lt;div class=&quot;was&quot;&gt;${t(&quot;was&quot;,{v:ref.ok?t(&quot;ok&quot;):t(&quot;no&quot;)})}&lt;/div&gt;`:&quot;&quot;}
    &lt;div class=&quot;inputs&quot;&gt;
      &lt;label&gt;${t(&quot;inc&quot;)}&lt;input id=&quot;g-${i}&quot; value=&quot;${esc(c.group||&quot;&quot;)}&quot;&gt;&lt;/label&gt;
      &lt;label&gt;${t(&quot;own&quot;)}&lt;select id=&quot;c-${i}&quot; style=&quot;width:100%;min-width:0;border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:6px;padding:5px 4px;font-size:.82rem&quot;&gt;${HCD.clients.map((x,j)=&gt;`&lt;option value=&quot;${x.id}&quot;${x.id===c.client?&quot; selected&quot;:&quot;&quot;}&gt;${j+1}. ${esc(x.short)}&lt;/option&gt;`).join(&quot;&quot;)}&lt;/select&gt;&lt;/label&gt;
      &lt;label&gt;${t(&quot;price&quot;)}&lt;input id=&quot;l-${i}&quot; value=&quot;${esc(c.listing||&quot;&quot;)}&quot; placeholder=&quot;NH-…&quot; autocomplete=&quot;off&quot;&gt;&lt;/label&gt;
    &lt;/div&gt;
    &lt;div class=&quot;gap&quot; title=&quot;${t(&quot;maxPrice&quot;)} / ${t(&quot;price&quot;)}&quot;&gt;&lt;span style=&quot;width:${(share*100).toFixed(1)}%;background:${r.ok?&quot;var(--good)&quot;:&quot;var(--bad)&quot;}&quot;&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;dl class=&quot;results&quot; style=&quot;border-bottom:1px dashed var(--line);padding-bottom:10px&quot;&gt;
      &lt;dt&gt;${t(&quot;incL&quot;)}&lt;/dt&gt;&lt;dd class=&quot;num&quot;&gt;${eur(c.inc)}&lt;/dd&gt;
      &lt;dt&gt;${t(&quot;ownL&quot;)}&lt;/dt&gt;&lt;dd class=&quot;num&quot;&gt;${eur(c.own)}&lt;/dd&gt;
      &lt;dt&gt;${t(&quot;stepL&quot;)}&lt;/dt&gt;&lt;dd class=&quot;num&quot;&gt;+${eur(c.step||0)}&lt;/dd&gt;
    &lt;/dl&gt;
    &lt;dl class=&quot;results&quot; style=&quot;border-top:0;padding-top:8px&quot;&gt;
      &lt;dt&gt;${t(&quot;maxMonthly&quot;)}&lt;/dt&gt;&lt;dd class=&quot;num&quot;&gt;${eur(r.maxMonthly)}&lt;/dd&gt;
      &lt;dt&gt;${t(&quot;monthly&quot;)}&lt;/dt&gt;&lt;dd class=&quot;num&quot;&gt;${eur(r.monthly)}&lt;/dd&gt;
      &lt;dt&gt;${t(&quot;maxMortgage&quot;)}&lt;/dt&gt;&lt;dd class=&quot;num&quot;&gt;${eur(r.maxMortgage)}&lt;/dd&gt;
      &lt;div class=&quot;key&quot; style=&quot;display:contents&quot;&gt;&lt;dt&gt;${t(&quot;maxPrice&quot;)}&lt;/dt&gt;&lt;dd class=&quot;num&quot;&gt;${eur(r.maxPrice)}${ref&amp;&amp;Math.abs(d)&gt;.5?`&lt;span class=&quot;delta ${d&gt;0?&quot;up&quot;:&quot;down&quot;}&quot;&gt;${sgn(d,eurK)}&lt;/span&gt;`:&quot;&quot;}&lt;/dd&gt;&lt;/div&gt;
      &lt;div class=&quot;key&quot; style=&quot;display:contents&quot;&gt;&lt;dt&gt;${t(&quot;room&quot;)}&lt;/dt&gt;&lt;dd class=&quot;num&quot; style=&quot;color:${r.room&gt;=0?&quot;var(--good)&quot;:&quot;var(--bad)&quot;}&quot;&gt;${sgn(r.room,eur)}&lt;/dd&gt;&lt;/div&gt;
    &lt;/dl&gt;
    &lt;div class=&quot;cfoot&quot;&gt;&lt;button class=&quot;del&quot; data-del=&quot;${i}&quot;&gt;${t(&quot;remove&quot;)}&lt;/button&gt;&lt;/div&gt;`;
    el.addEventListener(&quot;click&quot;,e=&gt;{if(e.target.closest(&quot;input,button,select,label,option&quot;))return;if(S.sel===i)return;S.sel=i;render()});
    g.appendChild(el);
    const bind=(id,key,num)=&gt;{const inp=el.querySelector(&quot;#&quot;+id);
      inp.addEventListener(&quot;change&quot;,()=&gt;{const v=num?parseFloat(inp.value.replace(/[^\d.,-]/g,&quot;&quot;).replace(/\./g,&quot;&quot;).replace(&quot;,&quot;,&quot;.&quot;)):inp.value;
        if(num&amp;&amp;!isFinite(v)){inp.value=c[key];return}c[key]=v;render()})};
    const upd=(id,key)=&gt;{const inp=el.querySelector(&quot;#&quot;+id);inp.addEventListener(&quot;change&quot;,()=&gt;{c[key]=inp.value.trim();hydrate(c);prevOk=null;render()})};
    upd(&quot;g-&quot;+i,&quot;group&quot;);upd(&quot;c-&quot;+i,&quot;client&quot;);upd(&quot;l-&quot;+i,&quot;listing&quot;);
    el.querySelector(&quot;[data-del]&quot;).onclick=()=&gt;{S.clients.splice(i,1);if(S.ref)S.ref.splice(i,1);prevOk=null;S.sel=Math.min(S.sel,S.clients.length-1);render()};
  });
  const add=document.createElement(&quot;button&quot;);add.className=&quot;addcard&quot;;add.textContent=t(&quot;add&quot;);
  add.onclick=()=&gt;{S.clients.push(hydrate({group:(S.lang===&quot;nl&quot;?&quot;Groep &quot;:&quot;Group &quot;)+(S.clients.length+1),client:(HCD.clients[0]||{}).id,listing:&quot;&quot;}));
    if(S.ref)S.ref.push(null);S.sel=S.clients.length-1;prevOk=null;render()};
  g.appendChild(add);
  if(focusId){const f=document.getElementById(focusId);if(f)f.focus()}
}
function esc(s){return String(s).replace(/[&amp;&lt;&gt;&quot;]/g,m=&gt;({&quot;&amp;&quot;:&quot;&amp;amp;&quot;,&quot;&lt;&quot;:&quot;&amp;lt;&quot;,&quot;&gt;&quot;:&quot;&amp;gt;&quot;,&#x27;&quot;&#x27;:&quot;&amp;quot;&quot;}[m]))}

function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));for(const m of[1,1.5,2,2.5,3,4,5,6,8,10])if(m*p&gt;=v)return m*p;return 10*p}

function renderCmp(res){
  const box=document.getElementById(&quot;cmpChart&quot;);
  const L=S.clients.map((c,i)=&gt;({c,r:res[i],i})).filter(x=&gt;x.c.valid);
  if(!L.length){box.innerHTML=&quot;&quot;;return}
  const W=Math.max(560,box.clientWidth||800),LW=200,R=24,rowH=34,top=8,H=top+L.length*rowH+26;
  const mx=niceMax(Math.max(...L.map(x=&gt;Math.max(x.c.price,x.r.maxPrice)))*1.02);
  const x=v=&gt;LW+(W-LW-R)*v/mx;let s=`&lt;svg viewBox=&quot;0 0 ${W} ${H}&quot; width=&quot;${W}&quot; height=&quot;${H}&quot; role=&quot;img&quot; aria-label=&quot;${t(&quot;cmpH&quot;)}&quot;&gt;`;
  for(let k=0;k&lt;=4;k++){const v=mx*k/4,xx=x(v);s+=`&lt;line x1=&quot;${xx}&quot; x2=&quot;${xx}&quot; y1=&quot;${top}&quot; y2=&quot;${H-22}&quot; stroke=&quot;var(--line)&quot;/&gt;&lt;text x=&quot;${xx}&quot; y=&quot;${H-6}&quot; text-anchor=&quot;middle&quot;&gt;${eurK(v)}&lt;/text&gt;`}
  L.forEach(({c,r,i},k)=&gt;{const y=top+k*rowH;
    s+=`&lt;text class=&quot;lbl&quot; x=&quot;${LW-10}&quot; y=&quot;${y+rowH/2+4}&quot; text-anchor=&quot;end&quot;&gt;${esc(c.name)}&lt;/text&gt;`;
    s+=`&lt;rect x=&quot;${LW}&quot; y=&quot;${y+8}&quot; width=&quot;${Math.max(0,x(r.maxPrice)-LW)}&quot; height=&quot;${rowH-16}&quot; rx=&quot;4&quot; fill=&quot;var(--accent)&quot; opacity=&quot;${i===S.sel?1:.75}&quot;/&gt;`;
    const px=x(c.price);s+=`&lt;rect x=&quot;${px-1.5}&quot; y=&quot;${y+3}&quot; width=&quot;3&quot; height=&quot;${rowH-6}&quot; rx=&quot;1.5&quot; fill=&quot;var(--price)&quot;/&gt;`;
    s+=`&lt;text x=&quot;${Math.min(px,x(r.maxPrice))-6}&quot; y=&quot;${y+rowH/2+4}&quot; text-anchor=&quot;end&quot; style=&quot;fill:var(--accent-ink);font-weight:600&quot;&gt;${(x(r.maxPrice)-LW&gt;90&amp;&amp;px&gt;LW+90)?eurK(r.maxPrice):&quot;&quot;}&lt;/text&gt;`;
  });
  box.innerHTML=s+&quot;&lt;/svg&gt;&quot;;
}

function renderDetail(){
  const sel=document.getElementById(&quot;detailSel&quot;);
  sel.innerHTML=S.clients.map((c,i)=&gt;`&lt;option value=&quot;${i}&quot;${i===S.sel?&quot; selected&quot;:&quot;&quot;}&gt;${esc(c.name)}&lt;/option&gt;`).join(&quot;&quot;);
  const c=S.clients[S.sel];
  if(!c||!c.valid){document.getElementById(&quot;detailName&quot;).textContent=c?c.name+&quot; · &quot;+t(&quot;noHome&quot;):&quot;&quot;;document.getElementById(&quot;timeChart&quot;).innerHTML=&quot;&quot;;document.getElementById(&quot;rateTable&quot;).innerHTML=&quot;&quot;;document.getElementById(&quot;timeVerdict&quot;).innerHTML=&quot;&quot;;return}
  document.getElementById(&quot;detailName&quot;).textContent=c.name+(c[S.lang]?&quot; · &quot;+c[S.lang]:&quot;&quot;);
  const rows=timeline(c);
  // time chart
  const box=document.getElementById(&quot;timeChart&quot;);
  const W=Math.max(520,box.clientWidth||640),H=260,L=64,R=16,Tp=12,B=30;
  const vals=rows.flatMap(r=&gt;[r.price,r.maxP]);let lo=Math.min(...vals),hi=Math.max(...vals);
  const pad=(hi-lo)*.1||hi*.1;lo=Math.max(0,lo-pad);hi=hi+pad;
  const x=y=&gt;L+(W-L-R)*y/10,y=v=&gt;Tp+(H-Tp-B)*(1-(v-lo)/(hi-lo));
  let s=`&lt;svg viewBox=&quot;0 0 ${W} ${H}&quot; width=&quot;${W}&quot; height=&quot;${H}&quot; role=&quot;img&quot; aria-label=&quot;${t(&quot;timeH&quot;)}&quot;&gt;`;
  for(let k=0;k&lt;=4;k++){const v=lo+(hi-lo)*k/4,yy=y(v);s+=`&lt;line x1=&quot;${L}&quot; x2=&quot;${W-R}&quot; y1=&quot;${yy}&quot; y2=&quot;${yy}&quot; stroke=&quot;var(--line)&quot;/&gt;&lt;text x=&quot;${L-8}&quot; y=&quot;${yy+4}&quot; text-anchor=&quot;end&quot;&gt;${eurK(v)}&lt;/text&gt;`}
  rows.forEach(r=&gt;{s+=`&lt;text x=&quot;${x(r.y)}&quot; y=&quot;${H-10}&quot; text-anchor=&quot;middle&quot;&gt;${r.y}&lt;/text&gt;`});
  // gap area
  const pts=a=&gt;rows.map(r=&gt;`${x(r.y).toFixed(1)},${y(r[a]).toFixed(1)}`).join(&quot; &quot;);
  const area=rows.map(r=&gt;`${x(r.y)},${y(r.price)}`).concat(rows.slice().reverse().map(r=&gt;`${x(r.y)},${y(r.maxP)}`)).join(&quot; &quot;);
  s+=`&lt;polygon points=&quot;${area}&quot; fill=&quot;var(--bad)&quot; opacity=&quot;.1&quot;/&gt;`;
  s+=`&lt;polyline points=&quot;${pts(&quot;price&quot;)}&quot; fill=&quot;none&quot; stroke=&quot;var(--price)&quot; stroke-width=&quot;2.5&quot;/&gt;`;
  s+=`&lt;polyline points=&quot;${pts(&quot;maxP&quot;)}&quot; fill=&quot;none&quot; stroke=&quot;var(--accent)&quot; stroke-width=&quot;2.5&quot;/&gt;`;
  rows.forEach(r=&gt;{s+=`&lt;circle cx=&quot;${x(r.y)}&quot; cy=&quot;${y(r.price)}&quot; r=&quot;3&quot; fill=&quot;var(--price)&quot;/&gt;&lt;circle cx=&quot;${x(r.y)}&quot; cy=&quot;${y(r.maxP)}&quot; r=&quot;3&quot; fill=&quot;${r.ok?&quot;var(--good)&quot;:&quot;var(--accent)&quot;}&quot;/&gt;`});
  const last=rows[10];s+=`&lt;text x=&quot;${x(10)-4}&quot; y=&quot;${y(last.price)-8}&quot; text-anchor=&quot;end&quot; style=&quot;fill:var(--price);font-weight:600&quot;&gt;${eurK(last.price)}&lt;/text&gt;`;
  s+=`&lt;text x=&quot;${x(10)-4}&quot; y=&quot;${y(last.maxP)+16}&quot; text-anchor=&quot;end&quot; style=&quot;fill:var(--accent);font-weight:600&quot;&gt;${eurK(last.maxP)}&lt;/text&gt;`;
  s+=`&lt;text x=&quot;${W-R}&quot; y=&quot;${Tp+4}&quot; text-anchor=&quot;end&quot;&gt;${t(&quot;year&quot;)} →&lt;/text&gt;`;
  box.innerHTML=s+&quot;&lt;/svg&gt;&quot;;
  // verdict
  let v;
  if(rows[0].ok){const lose=rows.find(r=&gt;!r.ok);v=t(&quot;tvNow&quot;,{y:lose?t(&quot;tvLose&quot;,{n:lose.y}):t(&quot;tvKeep&quot;)})}
  else{const gain=rows.find(r=&gt;r.ok);v=gain?t(&quot;tvLater&quot;,{n:gain.y}):t(&quot;tvNever&quot;,{g:eur(-last.diff)})}
  document.getElementById(&quot;timeVerdict&quot;).innerHTML=v;
  // rate table
  const eff=S.rate+S.shock,rates=[];for(let r=.02;r&lt;=.0701;r+=.005)rates.push(+r.toFixed(4));
  const near=rates.reduce((a,b)=&gt;Math.abs(b-eff)&lt;Math.abs(a-eff)?b:a);
  let h=`&lt;thead&gt;&lt;tr&gt;&lt;th&gt;${t(&quot;rate&quot;)}&lt;/th&gt;&lt;th&gt;${t(&quot;maxMortgage&quot;)}&lt;/th&gt;&lt;th&gt;${t(&quot;monthly&quot;)}&lt;/th&gt;&lt;th&gt;${t(&quot;verdict&quot;)}&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;`;
  rates.forEach(r=&gt;{const k=calc(c,r);h+=`&lt;tr class=&quot;${r===near?&quot;cur&quot;:&quot;&quot;}&quot;&gt;&lt;td class=&quot;num&quot;&gt;${pct(r,1)}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${eur(k.maxMortgage)}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${eur(k.monthly)}&lt;/td&gt;&lt;td class=&quot;${k.ok?&quot;ok&quot;:&quot;no&quot;}&quot;&gt;${k.ok?t(&quot;ok&quot;):t(&quot;no&quot;)}&lt;/td&gt;&lt;/tr&gt;`});
  document.getElementById(&quot;rateTable&quot;).innerHTML=h+&quot;&lt;/tbody&gt;&quot;;
}

/* Events */
document.getElementById(&quot;lang-nl&quot;).onclick=()=&gt;{S.lang=&quot;nl&quot;;init()};
document.getElementById(&quot;lang-en&quot;).onclick=()=&gt;{S.lang=&quot;en&quot;;init()};
document.getElementById(&quot;beamer&quot;).onclick=e=&gt;{S.beamer=!S.beamer;document.documentElement.classList.toggle(&quot;beamer&quot;,S.beamer);e.currentTarget.setAttribute(&quot;aria-pressed&quot;,S.beamer);render()};
document.getElementById(&quot;shock&quot;).addEventListener(&quot;input&quot;,e=&gt;{S.shock=+e.target.value/100;render()});
document.getElementById(&quot;snap&quot;).onclick=()=&gt;{S.ref=S.clients.map(c=&gt;calc(c));render()};
document.getElementById(&quot;clearSnap&quot;).onclick=()=&gt;{S.ref=null;render()};
document.getElementById(&quot;resetClients&quot;).onclick=()=&gt;{S.clients=EXAMPLES.map(c=&gt;hydrate({...c}));S.ref=null;S.sel=0;prevOk=null;render()};
document.getElementById(&quot;detailSel&quot;).onchange=e=&gt;{S.sel=+e.target.value;render()};
let rt;addEventListener(&quot;resize&quot;,()=&gt;{clearTimeout(rt);rt=setTimeout(()=&gt;{renderCmp(S.clients.map(c=&gt;calc(c)));renderDetail()},150)});

function init(){document.getElementById(&quot;shock&quot;).min=0;document.getElementById(&quot;shock&quot;).max=4;document.getElementById(&quot;shock&quot;).step=.25;
  document.getElementById(&quot;shock&quot;).value=S.shock*100;document.documentElement.classList.toggle(&quot;beamer&quot;,S.beamer);
  document.getElementById(&quot;beamer&quot;).setAttribute(&quot;aria-pressed&quot;,S.beamer);
  applyText();buildParams();buildChips();prevOk=null;render()}
init();
&lt;/script&gt;

"></iframe>
<script>
function show(which) {
  const t = which === "teacher";
  document.getElementById("inbox").hidden = t;
  document.getElementById("teacher").hidden = !t;
  document.getElementById("tab-inbox").setAttribute("aria-selected", !t);
  document.getElementById("tab-teacher").setAttribute("aria-selected", t);
  try { history.replaceState(null, "", t ? "#teacher" : "#inbox"); } catch (e) {}
}
document.getElementById("tab-inbox").onclick = () => show("inbox");
document.getElementById("tab-teacher").onclick = () => show("teacher");
show(location.hash === "#teacher" ? "teacher" : "inbox");
// When opened from a downloaded file, the download link is not needed.
if (location.protocol === "file:") document.getElementById("dl").hidden = true;
</script>
